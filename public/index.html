<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tank Level Forecaster — 14-Day Graph</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-xl font-bold text-slate-900">🌧️ Tank Level Forecaster</h1>
          <p class="text-sm text-slate-500">
            14-day water level trajectory using tank history & Open-Meteo rainfall
          </p>
        </div>

        <!-- Tank Selector Form -->
        <form id="forecastForm" class="flex flex-wrap sm:flex-nowrap gap-2">
          <select
            id="tankSelect"
            class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-700"
          >
            <option value="">Loading tanks...</option>
          </select>
          <input
            id="fillSlider"
            type="number"
            min="5"
            max="100"
            value="65"
            title="Simulated Current Fill (%)"
            class="w-24 rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-700"
          />
          <button
            type="submit"
            id="runBtn"
            class="px-4 py-2 bg-[#0f766e] hover:bg-teal-800 text-white text-sm font-medium rounded-lg transition whitespace-nowrap"
          >
            Forecast Graph
          </button>
        </form>
      </div>

      <div id="errorBox" class="hidden mt-4 p-3 text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded-lg"></div>
    </div>

    <!-- KPI Metrics Row -->
    <div id="metricsRow" class="hidden grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <span class="text-xs text-slate-500">Current Level</span>
        <div id="kpiNowPct" class="text-2xl font-bold text-slate-800 mt-1">--%</div>
        <span id="kpiNowAcft" class="text-xs text-slate-400">-- Acft</span>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <span class="text-xs text-slate-500">Predicted in 14 Days</span>
        <div id="kpiPredPct" class="text-2xl font-bold text-[#0f766e] mt-1">--%</div>
        <span id="kpiPredAcft" class="text-xs text-slate-400">-- Acft</span>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <span class="text-xs text-slate-500">14-Day Outlook</span>
        <div id="kpiOutlook" class="text-lg font-bold mt-1.5">--</div>
        <span id="kpiTargetDate" class="text-xs text-slate-400">Target: --</span>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <span class="text-xs text-slate-500">Last 7d Rainfall</span>
        <div id="kpiRain" class="text-2xl font-bold text-slate-800 mt-1">-- mm</div>
        <span id="kpiCap" class="text-xs text-slate-400">Cap: -- Acft</span>
      </div>
    </div>

    <!-- Chart Container -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 id="chartTitle" class="text-base font-semibold text-slate-800">
          Water Fill Trajectory (%) & Daily Rainfall (mm)
        </h2>
        <span id="dateRangeLabel" class="text-xs text-slate-400"></span>
      </div>
      <div class="relative h-80 w-full">
        <canvas id="forecastChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    let tanksList = [];
    let chartInstance = null;

    const tankSelect = document.getElementById("tankSelect");
    const fillInput = document.getElementById("fillSlider");
    const runBtn = document.getElementById("runBtn");
    const errorBox = document.getElementById("errorBox");
    const metricsRow = document.getElementById("metricsRow");

    // 1. Load tanks from Express backend
    async function loadTanks() {
      try {
        const res = await fetch("/api/forecast/tanks");
        const data = await res.json();
        tanksList = data.tanks || [];
        tankSelect.innerHTML = tanksList
          .map(
            (t) =>
              `<option value="${t.name}">${t.name} (${Math.round(t.fill_ref).toLocaleString()} Acft)</option>`
          )
          .join("");

        if (tanksList.length > 0) {
          runForecast();
        }
      } catch (err) {
        showError("Failed to load tanks from server.");
      }
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove("hidden");
    }

    // 2. Request forecast and render Chart.js graph
    async function runForecast(e) {
      if (e) e.preventDefault();
      errorBox.classList.add("hidden");
      runBtn.disabled = true;
      runBtn.textContent = "Loading...";

      const selectedName = tankSelect.value;
      const tankMeta = tanksList.find((t) => t.name === selectedName);
      const startFillRatio = Math.min(1, Math.max(0.05, Number(fillInput.value) / 100));
      const baseStorage = (tankMeta?.fill_ref || 10000) * startFillRatio;

      // Generate 16 days of recent readings leading up to today
      const sampleReadings = Array.from({ length: 16 }, (_, idx) => {
        const d = new Date();
        d.setDate(d.getDate() - (15 - idx));
        // Slight realistic daily variation
        const wave = Math.sin(idx * 0.4) * (tankMeta.fill_ref * 0.008);
        return {
          date: d.toISOString().split("T")[0],
          storage_acft: Math.max(0, Math.round(baseStorage + wave)),
        };
      });

      try {
        const res = await fetch("/api/forecast/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tank: selectedName, readings: sampleReadings }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Prediction error");

        updateKPIs(data);
        renderChart(data);
      } catch (err) {
        showError(err.message);
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = "Forecast Graph";
      }
    }

    function updateKPIs(data) {
      metricsRow.classList.remove("hidden");
      const nowPct = (data.fill_now * 100).toFixed(1);
      const predPct = (data.predicted_fill_in_14d * 100).toFixed(1);
      const chgPct = (data.change * 100).toFixed(1);

      document.getElementById("kpiNowPct").textContent = `${nowPct}%`;
      document.getElementById("kpiNowAcft").textContent = `${data.storage_now_acft.toLocaleString()} Acft`;

      document.getElementById("kpiPredPct").textContent = `${predPct}%`;
      document.getElementById("kpiPredAcft").textContent = `${data.predicted_storage_in_14d_acft.toLocaleString()} Acft`;

      const outlookEl = document.getElementById("kpiOutlook");
      const sign = data.change > 0 ? "+" : "";
      if (data.outlook === "rising") {
        outlookEl.textContent = `↗ Rising (${sign}${chgPct}%)`;
        outlookEl.className = "text-lg font-bold mt-1.5 text-[#0f766e]";
      } else if (data.outlook === "falling") {
        outlookEl.textContent = `↘ Falling (${chgPct}%)`;
        outlookEl.className = "text-lg font-bold mt-1.5 text-[#e11d48]";
      } else {
        outlookEl.textContent = `→ Steady (${sign}${chgPct}%)`;
        outlookEl.className = "text-lg font-bold mt-1.5 text-[#475569]";
      }

      document.getElementById("kpiTargetDate").textContent = `By ${data.target_date}`;
      document.getElementById("kpiRain").textContent = `${data.rain_last_7d_mm} mm`;
      document.getElementById("kpiCap").textContent = `Ref Full: ${Math.round(data.fill_ref_acft).toLocaleString()} Acft`;
      document.getElementById("chartTitle").textContent = `${data.tank} — 14-Day Water Level Forecast`;
      document.getElementById("dateRangeLabel").textContent = `${data.history[0].date} → ${data.target_date}`;
    }

    function renderChart(data) {
      const ctx = document.getElementById("forecastChart").getContext("2d");

      // Generate future 14-day date labels
      const histLabels = data.history.map((h) => h.date);
      const futureLabels = [];
      const lastDate = new Date(data.from_date);
      for (let i = 1; i <= data.horizon_days; i++) {
        const d = new Date(lastDate);
        d.setDate(d.getDate() + i);
        futureLabels.push(d.toISOString().split("T")[0]);
      }

      const allLabels = [...histLabels, ...futureLabels];

      // Dataset 1: Historical Fill (%)
      const histData = [
        ...data.history.map((h) => h.fill_pct),
        ...Array(data.horizon_days).fill(null),
      ];

      // Dataset 2: 14-Day Forecast Trajectory (interpolated dashed line from today to +14d)
      const startFillPct = data.fill_now * 100;
      const endFillPct = data.predicted_fill_in_14d * 100;
      const forecastData = Array(histLabels.length - 1).fill(null);
      forecastData.push(Number(startFillPct.toFixed(1))); // anchor at from_date
      for (let i = 1; i <= data.horizon_days; i++) {
        const interp = startFillPct + ((endFillPct - startFillPct) * i) / data.horizon_days;
        forecastData.push(Number(interp.toFixed(1)));
      }

      // Dataset 3: Daily Rainfall (mm)
      const rainData = [
        ...data.history.map((h) => h.rain_mm),
        ...Array(data.horizon_days).fill(null),
      ];

      const forecastColor =
        data.outlook === "rising"
          ? "#0f766e"
          : data.outlook === "falling"
          ? "#e11d48"
          : "#d97706";

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: allLabels,
          datasets: [
            {
              label: "Historical Fill (%)",
              data: histData,
              borderColor: "#475569",
              backgroundColor: "rgba(71, 85, 105, 0.08)",
              borderWidth: 2.5,
              tension: 0.25,
              fill: true,
              yAxisID: "y",
            },
            {
              label: "14-Day Forecast (%)",
              data: forecastData,
              borderColor: forecastColor,
              backgroundColor: forecastColor,
              borderDash: [6, 4],
              borderWidth: 2.5,
              pointRadius: (ctx) => (ctx.dataIndex === allLabels.length - 1 ? 5 : 0),
              tension: 0.1,
              yAxisID: "y",
            },
            {
              type: "bar",
              label: "Daily Rain (mm)",
              data: rainData,
              backgroundColor: "rgba(15, 118, 110, 0.25)",
              borderColor: "#0f766e",
              borderWidth: 1,
              yAxisID: "yRain",
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          scales: {
            y: {
              type: "linear",
              position: "left",
              min: 0,
              max: 110,
              title: { display: true, text: "Tank Fill Level (%)" },
            },
            yRain: {
              type: "linear",
              position: "right",
              min: 0,
              suggestedMax: 50,
              grid: { drawOnChartArea: false },
              title: { display: true, text: "Rainfall (mm)" },
            },
          },
        },
      });
    }

    document.getElementById("forecastForm").addEventListener("submit", runForecast);
    loadTanks();
  </script>
</body>
</html>
